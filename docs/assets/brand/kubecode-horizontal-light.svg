<svg xmlns="http://www.w3.org/2000/svg" width="310" height="72" viewBox="0 0 310 72" role="img" aria-labelledby="title">
  <title id="title">Kubecode horizontal logo for light backgrounds</title>

  <defs>
    <linearGradient id="kc-blue-gradient" x1="24" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F63F5"/>
      <stop offset="0.56" stop-color="#5268F8"/>
      <stop offset="1" stop-color="#91A0FF"/>
    </linearGradient>
    <linearGradient id="kc-blue-gradient-dark" x1="24" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#536BFF"/>
      <stop offset="1" stop-color="#A4B0FF"/>
    </linearGradient>
    <linearGradient id="kc-mint-gradient" x1="90" y1="82" x2="128" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36E3B2"/>
      <stop offset="1" stop-color="#2BD9A8"/>
    </linearGradient>
    <filter id="kc-soft-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#11131A" flood-opacity=".12"/>
    </filter>
  </defs>

  <g transform="translate(2 4) scale(.36)">
    
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M102 30H58C38 30 27 41 27 61V139C27 159 38 170 58 170H70L105 116"
          stroke="#4F63F5" stroke-width="28"/>
    <path d="M126 30H143C163 30 174 41 174 61V79"
          stroke="url(#kc-blue-gradient)" stroke-width="28"/>
    <path d="M174 104V139C174 159 163 170 143 170H113"
          stroke="url(#kc-blue-gradient)" stroke-width="28"/>
  </g>
  <rect x="91" y="80" width="38" height="38" rx="11" fill="url(#kc-mint-gradient)"/>
  <circle cx="110" cy="99" r="3.2" fill="#11AF80" opacity=".75"/>

  </g>
  <text x="84" y="57" font-family="'Inter Display', Inter, Arial, sans-serif" font-size="46" font-weight="650"
        letter-spacing="-1.8" fill="#11131A">Kubecode</text>

</svg>
